version: '3.8'

services:
  # ==================== AUTH SERVICE ====================
  auth_db:
    image: postgres:16
    container_name: auth_db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  auth_service:
    build: ./services/auth_service
    container_name: auth_service
    volumes:
      - ./services/auth_service:/app
      - /var/run/docker.sock:/var/run/docker.sock  # Для Promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro  # Для збору логів
    env_file:
      - ./services/auth_service/.env.example
    depends_on:
      auth_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8000"
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    # ВИДАЛИТИ секцію logging - тепер логі збирає Promtail
    networks:
      - app-network

  # ==================== PROFILE SERVICE ====================
  profile_db:
    image: postgres:16
    container_name: profile_db
    environment:
      POSTGRES_DB: profiledb
      POSTGRES_USER: profileuser
      POSTGRES_PASSWORD: profilepass
    volumes:
      - profile_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profileuser -d profiledb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  profile_service:
    build: ./services/profile_service
    container_name: profile_service
    volumes:
      - ./services/profile_service:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    env_file:
      - ./services/profile_service/.env.example
    depends_on:
      profile_db:
        condition: service_healthy
    ports:
      - "8002:8000"
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - app-network

  # ==================== BOARD SERVICE ====================
  board_db:
    image: postgres:16
    container_name: board_db
    environment:
      POSTGRES_DB: boarddb
      POSTGRES_USER: boarduser
      POSTGRES_PASSWORD: boardpass
    volumes:
      - board_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boarduser -d boarddb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  board_service:
    build: ./services/board_service
    container_name: board_service
    volumes:
      - ./services/board_service:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    env_file:
      - ./services/board_service/.env.example
    depends_on:
      board_db:
        condition: service_healthy
    ports:
      - "8003:8000"
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - app-network

  # ==================== RABBITMQ ====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "15672:15672"
    networks:
      - app-network

  # ==================== LOKI ====================
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - app-network

  # ==================== PROMTAIL ====================
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./config/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - app-network

  # ==================== GRAFANA ====================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - loki
    networks:
      - app-network

volumes:
  rabbitmq_data:
  auth_db_data:
  profile_db_data:
  board_db_data:
  grafana_data:
  loki_data:

networks:
  app-network:
    driver: bridge