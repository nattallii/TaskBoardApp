server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-logs
          __path__: /var/lib/docker/containers/*/*log
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]

  # Додаткові правила для конкретних сервісів
  - job_name: auth_service
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth_service
          service: auth
          __path__: /var/lib/docker/containers/*auth_service*/*log

  - job_name: profile_service
    static_configs:
      - targets:
          - localhost
        labels:
          job: profile_service
          service: profile
          __path__: /var/lib/docker/containers/*profile_service*/*log

  - job_name: board_service
    static_configs:
      - targets:
          - localhost
        labels:
          job: board_service
          service: board
          __path__: /var/lib/docker/containers/*board_service*/*log

  - job_name: rabbitmq
    static_configs:
      - targets:
          - localhost
        labels:
          job: rabbitmq
          service: message_queue
          __path__: /var/lib/docker/containers/*rabbitmq*/*log